<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShopEase</title>
<style>
:root{--ink:#182230;--muted:#667085;--line:#e8ebef;--accent:#6c4cf1;--wash:#f6f7fb;--green:#18845b}*{box-sizing:border-box}body{margin:0;font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--wash)}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 15px;font-weight:650;background:var(--accent);color:white}button.secondary{background:white;color:var(--ink);border:1px solid var(--line)}button.danger{color:#b42318;background:#fff1f0}.top{background:white;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}.bar{max-width:1120px;margin:auto;padding:15px 22px;display:flex;align-items:center;gap:18px}.brand{font-size:21px;font-weight:850;letter-spacing:-.7px;color:var(--accent);white-space:nowrap}.search{flex:1;display:flex;gap:8px}.search input{flex:1}.nav{display:flex;gap:8px}input,select{padding:11px 12px;border:1px solid #d9dde5;border-radius:9px;outline:none;background:white;min-width:0}input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #6c4cf122}.container{max-width:1120px;margin:30px auto;padding:0 22px}.hero{padding:30px 32px;border-radius:18px;color:white;background:linear-gradient(115deg,#30216d,#7558f5);margin-bottom:27px}.hero h1{font-size:32px;line-height:1.15;margin:0 0 8px}.hero p{margin:0;color:#e7e1ff}.heading{display:flex;justify-content:space-between;align-items:end;margin:24px 0 15px}.heading h2{margin:0;font-size:22px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card,.panel{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden}.product-img{height:150px;display:grid;place-items:center;font-size:60px;background:linear-gradient(145deg,#f3f0ff,#eef5ff)}.cardbody{padding:15px}.category{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.6px}.card h3{margin:4px 0;font-size:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.price{font-weight:800;font-size:17px}.stock{font-size:12px;color:var(--green)}.card button{width:100%;margin-top:13px}.panel{padding:22px;margin-bottom:18px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line)}.table th{color:var(--muted);font-weight:600;font-size:13px}.qty{display:inline-flex;align-items:center;gap:12px}.qty button{padding:4px 9px}.summary{max-width:380px;margin-left:auto}.summary .row{padding:7px 0}.total{font-size:19px;font-weight:800;border-top:1px solid var(--line);margin-top:8px;padding-top:14px!important}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid input,.formgrid select{width:100%}.full{grid-column:1/-1}.notice{padding:13px;border-radius:10px;background:#ecfdf3;color:#067647;margin-bottom:15px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs button.active{background:#332268}.empty{text-align:center;padding:40px 15px;color:var(--muted)}.adminrow{display:flex;gap:10px;align-items:center}.adminrow input{width:100%}footer{text-align:center;color:var(--muted);padding:30px;font-size:13px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.bar{flex-wrap:wrap}.search{order:3;flex-basis:100%}.table{font-size:13px}.table th,.table td{padding:10px 5px}.hide-sm{display:none}}
@media(max-width:500px){.container{padding:0 14px;margin:18px auto}.bar{padding:12px 14px}.grid{gap:10px}.product-img{height:115px}.cardbody{padding:11px}.hero{padding:23px}.hero h1{font-size:25px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.panel{padding:14px;overflow-x:auto}}
</style></head>
<body><header class="top"><div class="bar"><div class="brand">ShopEase</div><div class="search"><input id="search" placeholder="Search products..." oninput="render()"><button onclick="render()">Search</button></div><nav class="nav"><button class="secondary" onclick="page='shop';render()">Shop</button><button class="secondary" onclick="page='cart';render()">Cart <span id="cartcount">0</span></button><button class="secondary" onclick="page='orders';render()">Orders</button><button class="secondary" onclick="page='admin';render()">Admin</button></nav></div></header><main class="container" id="app"></main><footer>ShopEase · Simple online shopping demo</footer>
<script>
const starter=[{id:1,name:'Wireless Headphones',category:'Electronics',price:49.99,stock:18,icon:'🎧'},{id:2,name:'Everyday T-shirt',category:'Clothing',price:19.99,stock:42,icon:'👕'},{id:3,name:'Coffee Maker',category:'Home',price:39.99,stock:8,icon:'☕'},{id:4,name:'Travel Backpack',category:'Accessories',price:34.5,stock:12,icon:'🎒'},{id:5,name:'Running Shoes',category:'Clothing',price:64.99,stock:9,icon:'👟'},{id:6,name:'Desk Lamp',category:'Home',price:24.99,stock:15,icon:'💡'},{id:7,name:'Smart Watch',category:'Electronics',price:89.99,stock:6,icon:'⌚'},{id:8,name:'Water Bottle',category:'Accessories',price:14.5,stock:30,icon:'🧴'}];
let products=JSON.parse(localStorage.products||'null')||starter,cart=JSON.parse(localStorage.cart||'{}'),orders=JSON.parse(localStorage.orders||'[]'),page='shop';const save=()=>{localStorage.products=JSON.stringify(products);localStorage.cart=JSON.stringify(cart);localStorage.orders=JSON.stringify(orders)};const money=n=>'$'+Number(n).toFixed(2);const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);function render(){document.getElementById('cartcount').textContent=count();const app=document.getElementById('app');if(page==='shop'){let q=(document.getElementById('search')?.value||'').toLowerCase();let list=products.filter(p=>(p.name+' '+p.category).toLowerCase().includes(q));app.innerHTML=`<section class="hero"><h1>Find something you’ll love.</h1><p>Thoughtful picks for everyday life. Browse the collection and shop with ease.</p></section><div class="heading"><div><h2>Product catalogue</h2><span class="muted">${list.length} products</span></div></div><div class="grid">${list.map(p=>`<article class="card"><div class="product-img">${p.icon||'📦'}</div><div class="cardbody"><div class="category">${esc(p.category)}</div><h3>${esc(p.name)}</h3><div class="row"><span class="price">${money(p.price)}</span><span class="stock">${p.stock>0?p.stock+' in stock':'Out of stock'}</span></div><button ${p.stock<1?'disabled':''} onclick="add(${p.id})">Add to cart</button></div></article>`).join('')||'<div class="empty">No products match your search.</div>'}</div>`}else if(page==='cart')cartPage(app);else if(page==='checkout')checkoutPage(app);else if(page==='orders')ordersPage(app);else adminPage(app)}
function add(id){let p=products.find(x=>x.id===id);if((cart[id]||0)>=p.stock)return alert('No more stock available.');cart[id]=(cart[id]||0)+1;save();render()}function change(id,n){let p=products.find(x=>x.id===id);cart[id]=Math.max(0,Math.min(p.stock,(cart[id]||0)+n));if(!cart[id])delete cart[id];save();render()}function removeItem(id){delete cart[id];save();render()}function cartRows(){return Object.entries(cart).map(([id,q])=>({p:products.find(x=>x.id==id),q})).filter(x=>x.p)}function subtotal(){return cartRows().reduce((s,x)=>s+x.p.price*x.q,0)}
function cartPage(app){let rows=cartRows();app.innerHTML=`<div class="heading"><div><h2>Your cart</h2><span class="muted">${count()} items</span></div><button class="secondary" onclick="page='shop';render()">Continue shopping</button></div><section class="panel">${rows.length?`<table class="table"><thead><tr><th>Product</th><th>Price</th><th>Quantity</th><th>Subtotal</th><th></th></tr></thead><tbody>${rows.map(({p,q})=>`<tr><td>${p.icon||'📦'} ${esc(p.name)}</td><td>${money(p.price)}</td><td><span class="qty"><button class="secondary" onclick="change(${p.id},-1)">−</button>${q}<button class="secondary" onclick="change(${p.id},1)">+</button></span></td><td>${money(q*p.price)}</td><td><button class="danger" onclick="removeItem(${p.id})">Remove</button></td></tr>`).join('')}</tbody></table><div class="summary"><div class="row total"><span>Total</span><span>${money(subtotal())}</span></div><button style="width:100%;margin-top:12px" onclick="page='checkout';render()">Proceed to checkout</button></div>`:'<div class="empty">Your cart is empty.</div>'}</section>`}
function checkoutPage(app){if(!count()){page='cart';return render()}app.innerHTML=`<div class="heading"><h2>Checkout</h2></div><div id="success"></div><section class="panel"><h3>Shipping details</h3><form onsubmit="placeOrder(event)"><div class="formgrid"><input required name="name" placeholder="Full name"><input required type="email" name="email" placeholder="Email address"><input required class="full" name="address" placeholder="Street address"><input required name="city" placeholder="City"><input required name="zip" placeholder="ZIP / postal code"><select required class="full" name="payment"><option value="">Select payment method</option><option>Credit or debit card</option><option>Cash on delivery</option></select></div><div class="summary"><div class="row total"><span>Order total</span><span>${money(subtotal())}</span></div><button style="width:100%;margin-top:12px">Place order</button></div></form></section>`}
function placeOrder(e){e.preventDefault();let f=new FormData(e.target),items=cartRows().map(({p,q})=>({name:p.name,price:p.price,quantity:q}));for(let x of cartRows())x.p.stock-=x.q;orders.unshift({id:Date.now().toString().slice(-7),date:new Date().toLocaleDateString(),name:f.get('name'),email:f.get('email'),address:f.get('address')+', '+f.get('city')+' '+f.get('zip'),payment:f.get('payment'),items,total:subtotal(),status:'Processing'});cart={};save();page='orders';render();document.getElementById('app').insertAdjacentHTML('afterbegin','<div class="notice">Order placed successfully. Thank you for shopping!</div>')}
function ordersPage(app){app.innerHTML=`<div class="heading"><div><h2>Order history</h2><span class="muted">Your recent purchases</span></div></div>${orders.length?orders.map(o=>`<section class="panel"><div class="row"><div><strong>Order #${o.id}</strong><div class="muted">${o.date} · ${esc(o.status)}</div></div><strong>${money(o.total)}</strong></div><details style="margin-top:14px"><summary>View order details</summary><p class="muted">${o.items.map(i=>`${esc(i.name)} × ${i.quantity} — ${money(i.price*i.quantity)}`).join('<br>')}</p><small>${esc(o.name)} · ${esc(o.address)}</small></details></section>`).join(''):'<section class="panel empty">No orders yet. Your purchases will appear here.</section>'}`}
function adminPage(app){app.innerHTML=`<div class="heading"><div><h2>Product management</h2><span class="muted">Add products or update catalogue details</span></div></div><section class="panel"><h3>Add a product</h3><form class="adminrow" onsubmit="addProduct(event)"><input required name="name" placeholder="Product name"><input required name="category" placeholder="Category"><input required name="price" type="number" min="0" step=".01" placeholder="Price"><input required name="stock" type="number" min="0" placeholder="Stock"><button>Add</button></form></section><section class="panel"><table class="table"><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead><tbody>${products.map(p=>`<tr><td>${p.icon||'📦'} ${esc(p.name)}</td><td>${esc(p.category)}</td><td>${money(p.price)}</td><td><input style="width:80px" type="number" min="0" value="${p.stock}" onchange="setStock(${p.id},this.value)"></td><td><button class="danger" onclick="deleteProduct(${p.id})">Delete</button></td></tr>`).join('')}</tbody></table></section>`}
function addProduct(e){e.preventDefault();let f=new FormData(e.target);products.push({id:Date.now(),name:f.get('name'),category:f.get('category'),price:+f.get('price'),stock:+f.get('stock'),icon:'📦'});save();render()}function setStock(id,n){products.find(p=>p.id===id).stock=+n;save();render()}function deleteProduct(id){products=products.filter(p=>p.id!==id);delete cart[id];save();render()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}render();
</script></body></html>
